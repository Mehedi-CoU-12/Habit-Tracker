<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Coral diagonal gradient (HabitFlow accent) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E87842"/>
      <stop offset="100%" stop-color="#B95826"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect width="32" height="17" rx="7" fill="url(#gloss)"/>

  <!-- Sprout mark (24px glyph centered in 32 box) -->
  <g transform="translate(4 4)" fill="none" stroke="white" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21 v-8" />
    <path d="M12 13 c-4 0 -6 -2 -6 -5 c3 0 6 2 6 5z" />
    <path d="M12 13 c4 0 6 -3 6 -7 c-3 0 -6 3 -6 7z" />
  </g>
</svg>
