# Render Blueprint — deploys the NestJS API (apps/api) from this pnpm monorepo.
# Docs: https://render.com/docs/blueprint-spec
#
# The free plan spins services down after 15 min without inbound traffic.
# KeepAliveService (apps/api/src/common/keep-alive.service.ts) pings the
# service's own public URL (RENDER_EXTERNAL_URL, set by Render) every 10 min
# so it never goes idle.

services:
    - type: web
      name: habit-tracker-api
      runtime: node
      plan: free
      region: singapore # change to the region closest to your users
      rootDir: .
      # --prod=false forces devDependencies (nest CLI, prisma CLI, typescript)
      # to install even though NODE_ENV=production on Render.
      buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter api exec prisma generate && pnpm --filter api build
      # Migrations run at boot because the free plan has no preDeployCommand.
      # prisma is invoked via its .bin path so the runtime never needs pnpm.
      startCommand: cd apps/api && ./node_modules/.bin/prisma migrate deploy && node dist/src/main.js
      healthCheckPath: /health
      envVars:
          # Pinned because root engines ">=18" would resolve to the newest
          # Node, and Node 25+ no longer bundles corepack (used above).
          # The root .node-version file carries the same pin for services
          # created outside this blueprint; this env var wins when set.
          - key: NODE_VERSION
            value: 22.x
          - key: DATABASE_URL
            sync: false
          # Optional Redis cache (e.g. a Render Key Value instance or Upstash).
          # Leave unset to run without caching — the API works either way.
          - key: REDIS_URL
            sync: false
          - key: JWT_SECRET
            generateValue: true
          # Shared secret the web/mobile clients echo back as `x-app-client`.
          # Set the SAME value here and in the web (NEXT_PUBLIC_APP_CLIENT_KEY)
          # / mobile (EXPO_PUBLIC_APP_CLIENT_KEY) builds — so it can't be
          # generateValue (each side must know it). Leave unset to disable.
          - key: APP_CLIENT_KEY
            sync: false
          - key: FRONTEND_URL
            sync: false
          # Comma-separated browser origin allow-list. An entry may contain
          # `*`, which matches any run of characters inside one hostname
          # label — needed for Vercel preview deployments, whose hostname
          # changes with every push, e.g.
          #   https://habit-tracker-web-eight-iota.vercel.app,https://habit-tracker-web-*.vercel.app
          - key: CORS_ORIGINS
            sync: false
          - key: GOOGLE_CLIENT_ID
            sync: false
          - key: GOOGLE_CLIENT_SECRET
            sync: false
          - key: GOOGLE_CALLBACK_URL
            sync: false
          # Password-reset mail. On this free plan SMTP is NOT an option:
          # Render blocks outbound ports 25/465/587 on free instances, so
          # nodemailer just times out and the reset mail is silently dropped.
          # Use Resend — it is one HTTPS call, which is not blocked:
          #   1. Verify a domain at https://resend.com/domains
          #   2. RESEND_API_KEY = the API key
          #   3. MAIL_FROM      = e.g. "HabitFlow <no-reply@yourdomain.com>"
          # MAIL_FROM must be on the verified domain; without it mail sends
          # as the shared onboarding@resend.dev, which Resend 403s for every
          # recipient except your own account address.
          # GET /health reports the live transport and whether it can deliver.
          - key: RESEND_API_KEY
            sync: false
          - key: MAIL_FROM
            sync: false
          - key: SMTP_MAIL
            sync: false
          - key: SMTP_PASSWORD
            sync: false
          - key: SMTP_SERVICE
            sync: false
          - key: CLOUDINARY_API_KEY
            sync: false
          - key: CLOUDINARY_API_SECRET
            sync: false
          - key: CLOUDINARY_CLOUD_NAME
            sync: false
